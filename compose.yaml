# Lokal starten:   docker compose up --build   → http://localhost:4321
# Mit Caddy (TLS): docker compose --profile proxy up -d
# Mit Backup:      docker compose --profile backup up -d
#
# Wegen SQLite läuft immer genau eine Instanz der App.

services:
  web:
    build: .
    image: ghcr.io/treibhausdonaufeld/homepage:latest
    restart: unless-stopped
    ports:
      - "4321:4321"
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4321}
      # Lokal: Admin-Login ohne Authentik erlauben (in Produktion entfernen!)
      DEV_ADMIN_LOGIN: ${DEV_ADMIN_LOGIN:-true}
      HMAC_SECRET: ${HMAC_SECRET:-lokal-nur-zum-testen-hmac}
      SESSION_SECRET: ${SESSION_SECRET:-lokal-nur-zum-testen-session}
    volumes:
      - data:/data

  # Reverse-Proxy mit automatischem TLS (Profil „proxy“)
  caddy:
    image: caddy:2.10
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-treibhausdonaufeld.at}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Laufende Sicherung der SQLite-Datenbank nach S3/MinIO (Profil „backup“)
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ["backup"]
    restart: unless-stopped
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-treibhaus-backup}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
    volumes:
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
      - data:/data
    depends_on:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:
