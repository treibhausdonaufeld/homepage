<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start am Handy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 3900px; overflow: hidden; background: {{bg}}">
<dc-import name="Main" modus="{{modus}}" hint-size="390px,3900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modus":{"editor":"enum","options":["hell","dunkel"],"default":"hell"},"$preview":{"width":390,"height":3900}}'>
class Component extends DCLogic {
renderVals() {
const modus = this.props.modus ?? 'hell';
return { modus: modus, bg: modus === 'dunkel' ? '#100F0C' : '#EFEBE2' };
}
}
</script>
</body>
</html>
